<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ΑστυΝομικά</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/6.6.2/fuse.min.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");

      *, *::before, *::after { box-sizing: border-box; }

      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        transition: color 0.3s, background-color 0.3s, border-color 0.3s;
      }

      .gov-bg { background-color: #f3f6f9; }
      .dark .gov-bg { background-color: #1a1a1a; }
      .dark body { background-color: #0f0f0f; color: #e5e5e5; }

      .hidden { display: none !important; }

      /* Nav */
      .site-nav {
        background-color: #004592;
        box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
      }

      .nav-container {
        max-width: 80rem;
        margin: 0 auto;
        padding: 0 1rem;
      }
      @media (min-width: 640px) { .nav-container { padding: 0 1.5rem; } }
      @media (min-width: 1024px) { .nav-container { padding: 0 2rem; } }

      .nav-inner {
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 4rem;
      }

      .nav-logo-wrap { display: flex; align-items: center; }

      .nav-title { color: white; font-size: 1.5rem; font-weight: 700; margin: 0; }

      .dark-toggle {
        color: white;
        background: none;
        border: none;
        cursor: pointer;
        padding: 0.5rem;
        transition: color 0.15s ease;
        line-height: 0;
      }
      .dark-toggle:hover { color: #bfdbfe; }

      .icon-md { width: 1.5rem; height: 1.5rem; display: block; }
      .icon-sm { width: 1.25rem; height: 1.25rem; margin-left: 0.5rem; }

      /* Main */
      .main-content {
        max-width: 80rem;
        margin: 0 auto;
        padding: 2rem 1rem;
      }
      @media (min-width: 640px) { .main-content { padding: 2rem 1.5rem; } }
      @media (min-width: 1024px) { .main-content { padding: 2rem 2rem; } }

      /* Search */
      .search-section { margin-bottom: 2rem; }

      .search-wrapper {
        position: relative;
        max-width: 48rem;
        margin: 0 auto;
      }

      .search-input {
        width: 100%;
        padding: 1rem 1.5rem;
        font-size: 1.125rem;
        border: 2px solid #d1d5db;
        border-radius: 0.5rem;
        background-color: white;
        color: #111827;
        outline: none;
        font-family: inherit;
        transition: all 0.3s ease;
      }
      .search-input:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(0, 69, 146, 0.1);
      }
      .dark .search-input {
        border-color: #4b5563;
        background-color: #1f2937;
        color: white;
      }

      .search-icon {
        position: absolute;
        right: 1rem;
        top: 50%;
        transform: translateY(-50%);
        width: 1.5rem;
        height: 1.5rem;
        color: #9ca3af;
        pointer-events: none;
      }

      .result-count {
        text-align: center;
        margin-top: 0.5rem;
        font-size: 0.875rem;
        color: #4b5563;
      }
      .dark .result-count { color: #9ca3af; }

      /* States */
      .loading-state, .error-state, .no-results {
        text-align: center;
        padding: 3rem 0;
      }

      @keyframes spin { to { transform: rotate(360deg); } }

      .spinner {
        display: inline-block;
        border-radius: 50%;
        border: 4px solid #3b82f6;
        border-top-color: transparent;
        animation: spin 0.75s linear infinite;
        width: 3rem;
        height: 3rem;
      }
      .spinner-sm { width: 2rem; height: 2rem; margin-bottom: 0.5rem; }

      .loading-text { margin-top: 1rem; color: #4b5563; }
      .dark .loading-text { color: #9ca3af; }

      .state-icon-error { color: #ef4444; font-size: 3.75rem; margin-bottom: 1rem; }
      .state-icon-empty { color: #9ca3af; font-size: 3.75rem; margin-bottom: 1rem; }

      .state-title { font-size: 1.25rem; color: #374151; margin-bottom: 0.5rem; margin-top: 0; }
      .dark .state-title { color: #d1d5db; }

      .state-subtitle { color: #4b5563; margin: 0; }
      .dark .state-subtitle { color: #9ca3af; }

      /* Document grid */
      .doc-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      @media (min-width: 768px) { .doc-grid { grid-template-columns: repeat(2, 1fr); } }
      @media (min-width: 1024px) { .doc-grid { grid-template-columns: repeat(3, 1fr); } }

      /* Cards */
      .doc-card {
        background-color: white;
        border-radius: 0.5rem;
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
        padding: 1.5rem;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      .dark .doc-card { background-color: #1f2937; }
      .doc-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 24px rgba(0, 69, 146, 0.15);
      }
      .dark .doc-card:hover { box-shadow: 0 12px 24px rgba(255, 255, 255, 0.1); }

      .card-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 1rem;
      }

      .doc-icon {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        font-weight: 600;
        font-size: 12px;
      }
      .doc-icon-pdf { background-color: #fee2e2; color: #991b1b; }
      .doc-icon-docx { background-color: #dbeafe; color: #1e40af; }
      .dark .doc-icon-pdf { background-color: rgba(127,29,29,0.5); color: #fca5a5; }
      .dark .doc-icon-docx { background-color: rgba(30,58,138,0.5); color: #93c5fd; }

      .card-title {
        font-size: 1.125rem;
        font-weight: 600;
        color: #111827;
        margin: 0 0 0.75rem 0;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        line-clamp: 2;
        overflow: hidden;
      }
      .dark .card-title { color: white; }

      .card-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }

      .card-date { font-size: 0.875rem; color: #4b5563; }
      .dark .card-date { color: #9ca3af; }

      /* Tags */
      .tag {
        padding: 0.25rem 0.5rem;
        font-size: 0.75rem;
        border-radius: 0.25rem;
        transition: all 0.2s ease;
        text-decoration: none;
        display: inline-block;
      }
      .tag-linked { background-color: #eff6ff; color: #1d4ed8; }
      .tag-linked:hover { background-color: #bfdbfe; }
      .dark .tag-linked { background-color: rgba(30,58,138,0.3); color: #93c5fd; }
      .dark .tag-linked:hover { background-color: rgba(37,99,235,0.6); color: #bfdbfe; }

      .tag-plain { background-color: #f3f4f6; color: #374151; }
      .dark .tag-plain { background-color: #374151; color: #d1d5db; }

      /* Modal overlay */
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        z-index: 1000;
        overflow-y: auto;
      }
      .modal.active {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .modal-inner {
        background: white;
        border-radius: 0.5rem;
        box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        max-width: 56rem;
        width: 100%;
        max-height: 90vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .dark .modal-inner { background-color: #1f2937; }

      .modal-header {
        padding: 1.5rem;
        border-bottom: 1px solid #e5e7eb;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .dark .modal-header { border-bottom-color: #374151; }

      .modal-title-wrap { flex: 1; padding-right: 1rem; }

      .modal-title { font-size: 1.5rem; font-weight: 700; color: #111827; margin: 0 0 0.5rem 0; }
      .dark .modal-title { color: white; }

      .modal-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; }

      .modal-close {
        color: #6b7280;
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
        line-height: 0;
        transition: color 0.15s ease;
      }
      .modal-close:hover { color: #374151; }
      .dark .modal-close { color: #9ca3af; }
      .dark .modal-close:hover { color: #e5e7eb; }

      .modal-body { padding: 1.5rem; overflow-y: auto; flex: 1; }

      .modal-content { max-width: none; }
      .modal-content p { margin-bottom: 1em; }
      .modal-content h1, .modal-content h2, .modal-content h3 { font-weight: 600; margin: 1.5em 0 0.5em; }
      .modal-content ul, .modal-content ol { padding-left: 1.5em; margin-bottom: 1em; }
      .dark .modal-content { color: #e5e7eb; }

      .modal-footer {
        padding: 1.5rem;
        border-top: 1px solid #e5e7eb;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .dark .modal-footer { border-top-color: #374151; }

      .modal-date { font-size: 0.875rem; color: #4b5563; }
      .dark .modal-date { color: #9ca3af; }

      .modal-link {
        background-color: #004592;
        color: white;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        text-decoration: none;
        transition: background-color 0.15s ease;
      }
      .modal-link:hover { background-color: #1d4ed8; }

      .modal-tag {
        padding: 0.25rem 0.75rem;
        font-size: 0.875rem;
        background-color: #f3f4f6;
        color: #374151;
        border-radius: 9999px;
        text-decoration: none;
        display: inline-block;
        transition: background-color 0.15s ease;
      }
      .modal-tag:hover { background-color: #dbeafe; }
      .dark .modal-tag { background-color: #374151; color: #d1d5db; }
      .dark .modal-tag:hover { background-color: #1e3a5f; }

      /* Preview / iframe */
      .preview-container {
        width: 100%;
        height: 60vh;
        border: 1px solid #e5e7eb;
        border-radius: 0.5rem;
        overflow: hidden;
        background-color: #f9fafb;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .dark .preview-container { border-color: #374151; background-color: #111827; }

      .preview-loader { text-align: center; }
      .preview-loader-text { color: #4b5563; font-size: 0.875rem; }
      .dark .preview-loader-text { color: #9ca3af; }

      .preview-iframe { width: 100%; height: 100%; border: none; }

      .preview-error { text-align: center; padding: 1.5rem; }
      .preview-error-icon { color: #eab308; font-size: 2.25rem; margin-bottom: 0.75rem; }
      .preview-error-title { color: #374151; margin-bottom: 0.5rem; }
      .dark .preview-error-title { color: #d1d5db; }
      .preview-error-subtitle { font-size: 0.875rem; color: #4b5563; margin-bottom: 1rem; }
      .dark .preview-error-subtitle { color: #9ca3af; }

      .preview-error-btn {
        background-color: #004592;
        color: white;
        padding: 0.5rem 1rem;
        border-radius: 0.25rem;
        border: none;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.875rem;
        transition: background-color 0.15s ease;
      }
      .preview-error-btn:hover { background-color: #1d4ed8; }

      .doc-text { white-space: pre-wrap; font-size: 0.875rem; line-height: 1.625; }

      /* Animations */
      .fade-in { animation: fadeIn 0.3s ease-in; }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body class="gov-bg">
    <nav class="site-nav">
      <div class="nav-container">
        <div class="nav-inner">
          <div class="nav-logo-wrap">
            <h1 class="nav-title">ΑστυΝομικά</h1>
          </div>
          <button
            id="darkModeToggle"
            class="dark-toggle"
            aria-label="Toggle dark mode"
          >
            <svg
              id="sunIcon"
              class="icon-md"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
              ></path>
            </svg>
            <svg
              id="moonIcon"
              class="icon-md hidden"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
              ></path>
            </svg>
          </button>
        </div>
      </div>
    </nav>

    <main class="main-content">
      <div class="search-section">
        <div class="search-wrapper">
          <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="Αναζήτηση νομοθεσίας..."
            aria-label="Search legislation"
          />
          <svg
            class="search-icon"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            ></path>
          </svg>
        </div>
        <p class="result-count" id="resultCount">
          Εμφάνιση των τελευταίων 10 εγγράφων
        </p>
      </div>

      <div id="loadingState" class="loading-state">
        <div class="spinner"></div>
        <p class="loading-text">Φόρτωση δεδομένων...</p>
      </div>

      <div id="errorState" class="error-state hidden">
        <div class="state-icon-error">⚠️</div>
        <p class="state-title">Αδυναμία φόρτωσης δεδομένων</p>
        <p class="state-subtitle">
          Βεβαιωθείτε ότι το αρχείο data.json βρίσκεται στον ίδιο φάκελο.
        </p>
      </div>

      <div id="documentGrid" class="doc-grid hidden"></div>

      <div id="noResults" class="no-results hidden">
        <div class="state-icon-empty">🔍</div>
        <p class="state-title">Δεν βρέθηκαν αποτελέσματα</p>
        <p class="state-subtitle">Δοκιμάστε διαφορετικούς όρους αναζήτησης</p>
      </div>
    </main>

    <div
      id="modal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
    >
      <div class="modal-inner">
        <div class="modal-header">
          <div class="modal-title-wrap">
            <h2 id="modalTitle" class="modal-title"></h2>
            <div id="modalTags" class="modal-tags"></div>
          </div>
          <button
            id="closeModal"
            class="modal-close"
            aria-label="Close modal"
          >
            <svg
              class="icon-md"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              ></path>
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <div id="modalContent" class="modal-content"></div>
        </div>
        <div class="modal-footer">
          <div class="modal-date" id="modalDate"></div>
          <a
            id="modalLink"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            class="modal-link"
          >
            Προβολή Αρχικού Αρχείου
            <svg
              class="icon-sm"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"
              ></path>
            </svg>
          </a>
        </div>
      </div>
    </div>

    <script>
      let allDocuments = [];
      let folderUrls = {};
      let fuse = null;
      let currentDisplay = [];

      // Dark mode toggle
      const darkModeToggle = document.getElementById("darkModeToggle");
      const html = document.documentElement;
      const sunIcon = document.getElementById("sunIcon");
      const moonIcon = document.getElementById("moonIcon");

      if (localStorage.getItem("darkMode") === "true") {
        html.classList.add("dark");
        sunIcon.classList.add("hidden");
        moonIcon.classList.remove("hidden");
      }

      darkModeToggle.addEventListener("click", () => {
        html.classList.toggle("dark");
        const isDark = html.classList.contains("dark");
        localStorage.setItem("darkMode", isDark);
        sunIcon.classList.toggle("hidden");
        moonIcon.classList.toggle("hidden");
      });

      const docTypeConfig = {
        pdf: { label: "PDF", colorClass: "doc-icon-pdf" },
        docx: { label: "DOCX", colorClass: "doc-icon-docx" },
        doc: { label: "DOC", colorClass: "doc-icon-docx" },
      };

      async function loadData() {
        try {
          const response = await fetch("data.json");
          if (!response.ok) throw new Error("Failed to fetch data");

          const data = await response.json();

          // Support both new object format and old array format for safety
          allDocuments = data.documents || data;
          folderUrls = data.folderUrls || {};

          fuse = new Fuse(allDocuments, {
            keys: [
              { name: "title", weight: 1.0 },
              { name: "tags", weight: 0.7 },
              { name: "content", weight: 0.3 },
            ],
            threshold: 0.3,
            ignoreLocation: true,
            includeScore: true,
          });

          displayLatestDocuments();

          document.getElementById("loadingState").classList.add("hidden");
          document.getElementById("documentGrid").classList.remove("hidden");
        } catch (error) {
          console.error("Error loading data:", error);
          document.getElementById("loadingState").classList.add("hidden");
          document.getElementById("errorState").classList.remove("hidden");
        }
      }

      function displayLatestDocuments() {
        const sorted = [...allDocuments].sort((a, b) => {
          const dateA = new Date(a.modifiedAt || a.createdAt);
          const dateB = new Date(b.modifiedAt || b.createdAt);
          return dateB - dateA;
        });
        currentDisplay = sorted.slice(0, 10);
        renderDocuments(currentDisplay);
        document.getElementById("resultCount").textContent =
          "Εμφάνιση των τελευταίων 10 εγγράφων";
      }

      // Debounce utility function
      function debounce(func, delay) {
        let timeoutId;
        return function (...args) {
          clearTimeout(timeoutId);
          timeoutId = setTimeout(() => {
            func.apply(this, args);
          }, delay);
        };
      }

      // Search handler function
      function handleSearch(query) {
        const trimmedQuery = query.trim();

        if (trimmedQuery === "") {
          displayLatestDocuments();
        } else {
          const results = fuse.search(trimmedQuery);
          currentDisplay = results.map((r) => r.item);
          renderDocuments(currentDisplay);
          document.getElementById("resultCount").textContent =
            `Βρέθηκαν ${currentDisplay.length} αποτελέσματα`;
        }
      }

      // Create debounced search function with 300ms delay
      const debouncedSearch = debounce(handleSearch, 300);

      // Attach to search input
      const searchInput = document.getElementById("searchInput");
      searchInput.addEventListener("input", (e) => {
        debouncedSearch(e.target.value);
      });

      function getFolderUrlForTag(docTags, tagIndex) {
        // Reconstruct the path up to the clicked tag
        const path = docTags.slice(0, tagIndex + 1).join("/");
        return folderUrls[path] || "#";
      }

      function renderDocuments(documents) {
        const grid = document.getElementById("documentGrid");
        const noResults = document.getElementById("noResults");

        if (documents.length === 0) {
          grid.classList.add("hidden");
          noResults.classList.remove("hidden");
          return;
        }

        grid.classList.remove("hidden");
        noResults.classList.add("hidden");

        grid.innerHTML = documents
          .map((doc) => createDocumentCard(doc))
          .join("");

        document.querySelectorAll(".doc-card").forEach((card, index) => {
          card.addEventListener("click", () => openModal(documents[index]));
        });
      }

      function createDocumentCard(doc) {
        const config = docTypeConfig[doc.type] || docTypeConfig.docx;
        const date = formatDate(doc.modifiedAt || doc.createdAt);

        return `
          <div class="doc-card fade-in" role="button" tabindex="0">
            <div class="card-header">
              <div class="doc-icon ${config.colorClass}">
                ${config.label}
              </div>
            </div>
            <h3 class="card-title">${escapeHtml(doc.title)}</h3>
            <div class="card-tags">
              ${doc.tags
                .slice(0, 3)
                .map((tag, idx) => {
                  const url = getFolderUrlForTag(doc.tags, idx);
                  const hasUrl = url !== "#";
                  return `<a href="${url}" target="_blank" onclick="event.stopPropagation();" class="tag ${hasUrl ? "tag-linked" : "tag-plain"}">${escapeHtml(tag)}</a>`;
                })
                .join("")}
              ${doc.tags.length > 3 ? `<span class="tag tag-plain">+${doc.tags.length - 3}</span>` : ""}
            </div>
            <div class="card-date">Τελευταία ενημέρωση: ${date}</div>
          </div>
        `;
      }

      const modal = document.getElementById("modal");
      const closeModalBtn = document.getElementById("closeModal");

      // Helper function to convert Google Drive URL to embed format
      function getEmbedUrl(url) {
        const driveMatch = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
        if (driveMatch) {
          return `https://drive.google.com/file/d/${driveMatch[1]}/preview`;
        }
        return url;
      }

      // Helper function to display content fallback
      function displayContentFallback(doc, contentDiv) {
        if (doc.type === "docx" || doc.type === "doc") {
          contentDiv.innerHTML = doc.content;
        } else {
          contentDiv.innerHTML = `<pre class="doc-text">${escapeHtml(doc.content)}</pre>`;
        }
        document.getElementById("modalLink").classList.add("hidden");
      }

      // openModal with iframe handling
      function openModal(doc) {
        document.getElementById("modalTitle").textContent = doc.title;
        document.getElementById("modalTags").innerHTML = doc.tags
          .map(
            (tag) => `<span class="modal-tag">${escapeHtml(tag)}</span>`,
          )
          .join("");

        const contentDiv = document.getElementById("modalContent");

        if (doc.previewUrl && doc.previewUrl.trim() !== "") {
          const embedUrl = getEmbedUrl(doc.previewUrl);

          contentDiv.innerHTML = `
            <div class="preview-container">
              <div id="iframeLoader" class="preview-loader">
                <div class="spinner spinner-sm"></div>
                <p class="preview-loader-text">Φόρτωση εγγράφου...</p>
              </div>
              <iframe
                id="docIframe"
                src="${embedUrl}"
                class="preview-iframe hidden"
                frameborder="0"
                title="Document preview"
              ></iframe>
              <div id="iframeError" class="preview-error hidden">
                <div class="preview-error-icon">⚠️</div>
                <p class="preview-error-title">Δεν ήταν δυνατή η προεπισκόπηση του εγγράφου</p>
                <p class="preview-error-subtitle">Το έγγραφο ενδέχεται να απαιτεί άδεια πρόσβασης</p>
                <button onclick="window.open('${doc.previewUrl}', '_blank')" class="preview-error-btn">
                  Άνοιγμα σε νέα καρτέλα
                </button>
              </div>
            </div>
          `;

          const iframe = document.getElementById("docIframe");
          const loader = document.getElementById("iframeLoader");
          const errorDiv = document.getElementById("iframeError");

          let loadTimeout = setTimeout(() => {
            loader.classList.add("hidden");
            errorDiv.classList.remove("hidden");
          }, 5000);

          iframe.onload = function () {
            clearTimeout(loadTimeout);
            loader.classList.add("hidden");
            iframe.classList.remove("hidden");
          };

          iframe.onerror = function () {
            clearTimeout(loadTimeout);
            loader.classList.add("hidden");
            errorDiv.classList.remove("hidden");
          };

          document.getElementById("modalLink").classList.remove("hidden");
          document.getElementById("modalLink").href = doc.previewUrl;
        } else {
          displayContentFallback(doc, contentDiv);
        }

        document.getElementById("modalDate").textContent =
          `Τελευταία ενημέρωση: ${formatDate(doc.modifiedAt || doc.createdAt)}`;

        modal.classList.add("active");
        document.body.style.overflow = "hidden";
      }

      function closeModal() {
        modal.classList.remove("active");
        document.body.style.overflow = "";
      }

      closeModalBtn.addEventListener("click", closeModal);
      modal.addEventListener("click", (e) => {
        if (e.target === modal) closeModal();
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });

      function formatDate(isoString) {
        const date = new Date(isoString);
        return date.toLocaleDateString("el-GR", {
          year: "numeric",
          month: "long",
          day: "numeric",
        });
      }

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      loadData();
    </script>
  </body>
</html>
