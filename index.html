<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ΑστυΝομικά</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              govBlue: "#004592",
            },
          },
        },
      };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/6.6.2/fuse.min.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");

      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      .gov-blue {
        background-color: #004592;
      }

      .gov-bg {
        background-color: #f3f6f9;
      }

      .dark .gov-bg {
        background-color: #1a1a1a;
      }

      .dark body {
        background-color: #0f0f0f;
        color: #e5e5e5;
      }

      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        z-index: 1000;
        overflow-y: auto;
      }

      .modal.active {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .card-hover {
        transition: all 0.3s ease;
      }

      .card-hover:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 24px rgba(0, 69, 146, 0.15);
      }

      .dark .card-hover:hover {
        box-shadow: 0 12px 24px rgba(255, 255, 255, 0.1);
      }

      .search-input {
        transition: all 0.3s ease;
      }

      .search-input:focus {
        box-shadow: 0 0 0 3px rgba(0, 69, 146, 0.1);
      }

      .doc-icon {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        font-weight: 600;
        font-size: 12px;
      }

      .fade-in {
        animation: fadeIn 0.3s ease-in;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body class="gov-bg transition-colors duration-300">
    <nav class="gov-blue shadow-lg">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
          <div class="flex items-center">
            <h1 class="text-white text-2xl font-bold">ΑστυΝομικά</h1>
          </div>
          <button
            id="darkModeToggle"
            class="text-white hover:text-blue-200 transition-colors p-2"
            aria-label="Toggle dark mode"
          >
            <svg
              id="sunIcon"
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
              ></path>
            </svg>
            <svg
              id="moonIcon"
              class="w-6 h-6 hidden"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
              ></path>
            </svg>
          </button>
        </div>
      </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <div class="mb-8">
        <div class="relative max-w-3xl mx-auto">
          <input
            type="text"
            id="searchInput"
            class="search-input w-full px-6 py-4 text-lg border-2 border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:border-blue-500 bg-white text-gray-900 dark:bg-gray-800 dark:text-white"
            placeholder="Αναζήτηση νομοθεσίας..."
            aria-label="Search legislation"
          />
          <svg
            class="absolute right-4 top-1/2 transform -translate-y-1/2 w-6 h-6 text-gray-400"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            ></path>
          </svg>
        </div>
        <p
          class="text-center mt-2 text-sm text-gray-600 dark:text-gray-400"
          id="resultCount"
        >
          Εμφάνιση των τελευταίων 10 εγγράφων
        </p>
      </div>

      <div id="loadingState" class="text-center py-12">
        <div
          class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-blue-500 border-t-transparent"
        ></div>
        <p class="mt-4 text-gray-600 dark:text-gray-400">
          Φόρτωση δεδομένων...
        </p>
      </div>

      <div id="errorState" class="hidden text-center py-12">
        <div class="text-red-500 text-6xl mb-4">⚠️</div>
        <p class="text-xl text-gray-700 dark:text-gray-300 mb-2">
          Αδυναμία φόρτωσης δεδομένων
        </p>
        <p class="text-gray-600 dark:text-gray-400">
          Βεβαιωθείτε ότι το αρχείο data.json βρίσκεται στον ίδιο φάκελο.
        </p>
      </div>

      <div
        id="documentGrid"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden"
      ></div>

      <div id="noResults" class="hidden text-center py-12">
        <div class="text-gray-400 text-6xl mb-4">🔍</div>
        <p class="text-xl text-gray-700 dark:text-gray-300 mb-2">
          Δεν βρέθηκαν αποτελέσματα
        </p>
        <p class="text-gray-600 dark:text-gray-400">
          Δοκιμάστε διαφορετικούς όρους αναζήτησης
        </p>
      </div>
    </main>

    <div
      id="modal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
    >
      <div
        class="bg-white dark:bg-gray-800 rounded-lg shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-hidden flex flex-col"
      >
        <div
          class="p-6 border-b border-gray-200 dark:border-gray-700 flex justify-between items-start"
        >
          <div class="flex-1 pr-4">
            <h2
              id="modalTitle"
              class="text-2xl font-bold text-gray-900 dark:text-white mb-2"
            ></h2>
            <div id="modalTags" class="flex flex-wrap gap-2"></div>
          </div>
          <button
            id="closeModal"
            class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 transition-colors"
            aria-label="Close modal"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              ></path>
            </svg>
          </button>
        </div>
        <div class="p-6 overflow-y-auto flex-1">
          <div
            id="modalContent"
            class="prose dark:prose-invert max-w-none"
          ></div>
        </div>
        <div
          class="p-6 border-t border-gray-200 dark:border-gray-700 flex justify-between items-center"
        >
          <div
            class="text-sm text-gray-600 dark:text-gray-400"
            id="modalDate"
          ></div>
          <a
            id="modalLink"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            class="gov-blue text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition-colors font-medium inline-flex items-center"
          >
            Προβολή Αρχικού Αρχείου
            <svg
              class="w-5 h-5 ml-2"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"
              ></path>
            </svg>
          </a>
        </div>
      </div>
    </div>

    <script>
      let allDocuments = [];
      let fuse = null;
      let currentDisplay = [];

      // Dark mode toggle
      const darkModeToggle = document.getElementById("darkModeToggle");
      const html = document.documentElement;
      const sunIcon = document.getElementById("sunIcon");
      const moonIcon = document.getElementById("moonIcon");

      if (localStorage.getItem("darkMode") === "true") {
        html.classList.add("dark");
        sunIcon.classList.add("hidden");
        moonIcon.classList.remove("hidden");
      }

      darkModeToggle.addEventListener("click", () => {
        html.classList.toggle("dark");
        const isDark = html.classList.contains("dark");
        localStorage.setItem("darkMode", isDark);
        sunIcon.classList.toggle("hidden");
        moonIcon.classList.toggle("hidden");
      });

      const docTypeConfig = {
        pdf: {
          label: "PDF",
          color: "bg-red-100 text-red-800 dark:bg-red-900 dark:text-red-200",
        },
        docx: {
          label: "DOCX",
          color:
            "bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200",
        },
        doc: {
          label: "DOC",
          color:
            "bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200",
        },
      };

      async function loadData() {
        try {
          const response = await fetch("data.json");
          if (!response.ok) throw new Error("Failed to fetch data");

          allDocuments = await response.json();

          fuse = new Fuse(allDocuments, {
            keys: [
              { name: "title", weight: 1.0 },
              { name: "tags", weight: 0.7 },
              { name: "content", weight: 0.3 },
            ],
            threshold: 0.3,
            ignoreLocation: true,
            includeScore: true,
          });

          displayLatestDocuments();

          document.getElementById("loadingState").classList.add("hidden");
          document.getElementById("documentGrid").classList.remove("hidden");
        } catch (error) {
          console.error("Error loading data:", error);
          document.getElementById("loadingState").classList.add("hidden");
          document.getElementById("errorState").classList.remove("hidden");
        }
      }

      function displayLatestDocuments() {
        const sorted = [...allDocuments].sort((a, b) => {
          const dateA = new Date(a.modifiedAt || a.createdAt);
          const dateB = new Date(b.modifiedAt || b.createdAt);
          return dateB - dateA;
        });
        currentDisplay = sorted.slice(0, 10);
        renderDocuments(currentDisplay);
        document.getElementById("resultCount").textContent =
          "Εμφάνιση των τελευταίων 10 εγγράφων";
      }

      // Debounce utility function
      function debounce(func, delay) {
        let timeoutId;
        return function (...args) {
          clearTimeout(timeoutId);
          timeoutId = setTimeout(() => {
            func.apply(this, args);
          }, delay);
        };
      }

      // Search handler function
      function handleSearch(query) {
        const trimmedQuery = query.trim();

        if (trimmedQuery === "") {
          displayLatestDocuments();
        } else {
          const results = fuse.search(trimmedQuery);
          currentDisplay = results.map((r) => r.item);
          renderDocuments(currentDisplay);
          document.getElementById(
            "resultCount"
          ).textContent = `Βρέθηκαν ${currentDisplay.length} αποτελέσματα`;
        }
      }

      // Create debounced search function with 300ms delay
      const debouncedSearch = debounce(handleSearch, 300);

      // Attach to search input
      const searchInput = document.getElementById("searchInput");
      searchInput.addEventListener("input", (e) => {
        debouncedSearch(e.target.value);
      });

      function renderDocuments(documents) {
        const grid = document.getElementById("documentGrid");
        const noResults = document.getElementById("noResults");

        if (documents.length === 0) {
          grid.classList.add("hidden");
          noResults.classList.remove("hidden");
          return;
        }

        grid.classList.remove("hidden");
        noResults.classList.add("hidden");

        grid.innerHTML = documents
          .map((doc) => createDocumentCard(doc))
          .join("");

        document.querySelectorAll(".doc-card").forEach((card, index) => {
          card.addEventListener("click", () => openModal(documents[index]));
        });
      }

      function createDocumentCard(doc) {
        const config = docTypeConfig[doc.type] || docTypeConfig.docx;
        const date = formatDate(doc.modifiedAt || doc.createdAt);

        return `
                <div class="doc-card card-hover bg-white dark:bg-gray-800 rounded-lg shadow-md p-6 cursor-pointer fade-in" role="button" tabindex="0">
                    <div class="flex items-start justify-between mb-4">
                        <div class="doc-icon ${config.color}">
                            ${config.label}
                        </div>
                    </div>
                    <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-3 line-clamp-2">
                        ${escapeHtml(doc.title)}
                    </h3>
                    <div class="flex flex-wrap gap-2 mb-4">
                        ${doc.tags
                          .slice(0, 3)
                          .map(
                            (tag) => `
                            <span class="px-2 py-1 text-xs bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded">
                                ${escapeHtml(tag)}
                            </span>
                        `
                          )
                          .join("")}
                        ${
                          doc.tags.length > 3
                            ? `<span class="px-2 py-1 text-xs bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded">+${
                                doc.tags.length - 3
                              }</span>`
                            : ""
                        }
                    </div>
                    <div class="text-sm text-gray-600 dark:text-gray-400">
                        Τελευταία ενημέρωση: ${date}
                    </div>
                </div>
            `;
      }

      const modal = document.getElementById("modal");
      const closeModalBtn = document.getElementById("closeModal");

      function openModal(doc) {
        document.getElementById("modalTitle").textContent = doc.title;
        document.getElementById("modalTags").innerHTML = doc.tags
          .map(
            (tag) => `
                <span class="px-3 py-1 text-sm bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-full">
                    ${escapeHtml(tag)}
                </span>
            `
          )
          .join("");

        const contentDiv = document.getElementById("modalContent");
        if (doc.type === "docx" || doc.type === "doc") {
          contentDiv.innerHTML = doc.content;
        } else {
          contentDiv.innerHTML = `<pre class="whitespace-pre-wrap">${escapeHtml(
            doc.content
          )}</pre>`;
        }

        document.getElementById(
          "modalDate"
        ).textContent = `Τελευταία ενημέρωση: ${formatDate(
          doc.modifiedAt || doc.createdAt
        )}`;
        document.getElementById("modalLink").href = doc.previewUrl;

        modal.classList.add("active");
        document.body.style.overflow = "hidden";
      }

      function closeModal() {
        modal.classList.remove("active");
        document.body.style.overflow = "";
      }

      closeModalBtn.addEventListener("click", closeModal);
      modal.addEventListener("click", (e) => {
        if (e.target === modal) closeModal();
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });

      function formatDate(isoString) {
        const date = new Date(isoString);
        return date.toLocaleDateString("el-GR", {
          year: "numeric",
          month: "long",
          day: "numeric",
        });
      }

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      loadData();
    </script>
  </body>
</html>
